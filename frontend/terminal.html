<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debug Terminal — GGUF Chatbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --border: #3c3c3c;
      --text: #cccccc;
      --text-dim: #666;
      --err: #f87171;
      --warn: #f59e0b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      overflow: hidden;
    }

    .term-header {
      height: 32px;
      background: #1a1a1a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      flex-shrink: 0;
    }
    .term-header-title {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .term-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .term-btn:hover { background: #333; color: var(--text); }

    .term-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .term-line {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .term-line-dim  { color: var(--text-dim); }
    .term-line-err  { color: var(--err); }
    .term-line-warn { color: var(--warn); }

    .term-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div class="term-wrapper">
    <div class="term-header">
      <span class="term-header-title">GGUF Chatbox — Debug Terminal</span>
      <button class="term-btn" id="btn-clear">Clear</button>
    </div>
    <div class="term-body" id="term-body">
      <p class="term-line term-line-dim">Debug terminal ready. Waiting for events…</p>
    </div>
  </div>

  <script>
    var termBody = document.getElementById('term-body');
    var MAX_LINES = 2000;

    function appendLine(text, cls) {
      var p = document.createElement('p');
      p.className = 'term-line' + (cls ? ' ' + cls : '');
      p.textContent = text;
      termBody.appendChild(p);
      // Trim old lines
      while (termBody.children.length > MAX_LINES) {
        termBody.removeChild(termBody.firstChild);
      }
      termBody.scrollTop = termBody.scrollHeight;
    }

    function classifyLine(line) {
      var lower = line.toLowerCase();
      if (lower.includes('error') || lower.includes('fail') || lower.includes('panic')) return 'term-line-err';
      if (lower.includes('warn')) return 'term-line-warn';
      return '';
    }

    // Listen for debug-log events from Rust
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen('debug-log', function (event) {
        var d = event.payload;
        if (!d) return;
        appendLine(d.line, d.error ? 'term-line-err' : classifyLine(d.line));
      });
    }

    // Clear button
    document.getElementById('btn-clear').addEventListener('click', function () {
      termBody.innerHTML = '<p class="term-line term-line-dim">Terminal cleared.</p>';
    });

    // Intercept window close → hide instead of destroy
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen('tauri://close-requested', async function (event) {
        var win = window.__TAURI__.window.getCurrentWindow();
        await win.hide();
      });
    }
  </script>
</body>
</html>
