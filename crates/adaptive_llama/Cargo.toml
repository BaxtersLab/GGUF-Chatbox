[package]
name = "adaptive_llama"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utils = { path = "../utils" }
logging = { path = "../logging" }
error_system = { path = "../error_system" }
once_cell = "1.20.0"
windows-sys = { version = "0.52.0", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }
